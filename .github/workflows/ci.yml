name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    name: Backend (quality and tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --no-cache-dir -r requirements.txt

      - name: Rodar lint (Ruff)
        run: ruff check .

      - name: Verificar formatação (Black)
        run: black --check .

      - name: Verificar imports (isort)
        run: isort --check-only .

      - name: Rodar testes (pytest)
        run: pytest -v

  frontend:
    name: Frontend (quality and tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        env:
          NODE_ENV: development

      - name: Verificar tipagem (TypeScript)
        run: npm run typecheck

      - name: Rodar lint
        run: npm run lint

      - name: Verificar formatação (Prettier)
        run: npm run format:check

      - name: Rodar testes com cobertura
        run: npm run test:coverage

      - name: Upload relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
